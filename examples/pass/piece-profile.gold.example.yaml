schema_version: 0.1.0
piece_profile_id: piece-profile.audit-gold.v1
agent_id: agent.audit-guardian-01
piece_type: gold
side: sente
role_name: Audit and Authorization Guardian
role_description: Stabilizes the board by checking authorization, trace continuity, and audit readiness.
lifecycle_state: active

capability_profile:
  allowed_actions:
    - inspect_authorization
    - validate_trace_chain
    - request_human_review
    - block_nonconformant_move

  denied_actions:
    - execute_business_action
    - modify_origin_record
    - approve_own_promotion
    - rewrite_human_axis

  tools:
    - tool.authorization-inspector
    - tool.trace-validator

  data_scopes:
    - data.authorization-receipts
    - data.trace-ledger
    - data.audit-findings

movement_profile:
  movement_policy_ref: policy.shogi-agent-legal-moves.v0.1
  max_hops_per_move: 1
  may_cross_security_zones: true
  may_enter_restricted_zones: true

authority_scope:
  authority_scope_ref: authority.audit-guardian
  max_autonomy: supervised
  requires_human_review_for:
    - override_denial
    - terminate_mission

resource_budget:
  max_tokens_per_move: 20000
  max_cost_per_move: 0.75
  currency: USD
  max_duration_seconds: 600
  max_concurrent_actions: 2

human_axis_binding_ref: human-axis.wind-mission.primary
created_at: "2026-07-27T00:00:00Z"

metadata:
  canonical_symbol: gold
